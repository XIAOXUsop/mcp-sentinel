name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # 无依赖的密钥扫描：不引第三方服务、不需要 token，纯 grep，跑完不到一秒。
      #
      # 为什么值得单独一个 job：**公开仓库里泄露一个 key 的代价，远大于这一步的开销**，
      # 而它漏掉的唯一可能是「根本没跑」。放在 CI 里才是每次提交都过一遍。
      #
      # ⚠️ 加新模式前**先在本地跑一遍**，确认不误报——测试夹具里的示例 token、
      # README 里的占位符都可能被误伤，而一条会无缘无故变红的检查只会被关掉。
      # 同样也要**反向验证**：造一个真密钥，确认它真的会红。
      - name: Scan for secrets
        run: |
          # 用 `git grep` 而不是 `grep -r`，两处都是实质改进：
          #
          #   1. 它只看**被跟踪的文件** —— target/ / node_modules/ / dist/ 这些构建产物
          #      天然不在范围内，不用再手写一串 --exclude-dir（那串还漏得掉）。
          #   2. 更要紧的是 **`--text`**：`grep -rI` 里的 `-I` 会**跳过二进制文件**，
          #      而本仓库恰好有一个**源码文件**被判成二进制——`SarifWriter.java` 里
          #      有两个 NUL 字节（那是工具指纹的分隔符字面量：反斜杠加一个 0）。
          #
          # 实测（2026-09-22）：往那个文件末尾追加一行「AWS Access Key ID 形态」的串，
          # （这里刻意不把那个串本身写进注释——它会让这条扫描在干净仓库上就变红，
          #   写注释的时候亲测过一次）
          # **原命令一条都没报**，照样打印「未检测到密钥/私钥泄露」并以 0 退出；
          # 换成下面的 `git grep --text` 才命中。也就是说这一步对该文件完全失明，
          # 而它是全仓库唯一被判成二进制的源码文件。
          #
          # 这个仓库存在的意义就是查出别人产物里的这类问题，自己的门禁更不能是摆设。
          if git grep -nE --text \
            "(sk-[A-Za-z0-9_-]{16,}|AKIA[0-9A-Z]{16}|BEGIN (RSA|EC|OPENSSH) PRIVATE KEY|api[_-]?key[[:space:]]*[:=][[:space:]]*['\"][A-Za-z0-9_-]{16,})" \
            -- . ':!*.lock' ; then
            echo "::error::检测到疑似密钥/私钥泄露"
            exit 1
          fi
          echo "未检测到密钥/私钥泄露"
