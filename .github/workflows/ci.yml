name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        run: ./mvnw -B verify

      - name: Export test classpath for the smoke-test server
        run: ./mvnw -B -q dependency:build-classpath -Dmdep.outputFile=target/cp.txt -Dmdep.includeScope=test

      - name: Smoke-test the scanner against a real MCP server
        run: |
          # 用测试用例里自带的 MCP 服务器做端到端冒烟：
          # 它含一个投毒工具，扫描器必须抓出来并以退出码 3 失败。
          CP="target/test-classes:$(cat target/cp.txt)"
          cat > /tmp/mcp.json <<EOF
          {
            "server": "ci-demo-server",
            "command": "java",
            "args": ["-cp", "$CP", "io.github.xiaoxusop.mcpsentinel.TestMcpServer"]
          }
          EOF

          set +e
          java -jar target/mcp-sentinel.jar scan --config /tmp/mcp.json
          code=$?
          set -e

          echo "退出码 = $code"
          if [ "$code" -ne 3 ]; then
            echo "::error::扫描器应检出 HIGH 风险并以 3 退出，实际为 $code"
            exit 1
          fi
          echo "扫描器按预期检出投毒工具并阻断"
        env:
          MAVEN_OPTS: -Dmaven.repo.local=.m2
