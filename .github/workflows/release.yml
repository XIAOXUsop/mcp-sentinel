name: Release

# 打 tag 即发布：构建产物自动挂到 GitHub Release。
# 手工上传容易漏、容易版本对不上，而这恰恰是使用者拿到的第一个东西。
#
# 但"自动"不等于"无条件"：见下面 preflight 那一步的说明。
on:
  push:
    tags: [ 'v*' ]

jobs:
  verification:
    uses: ./.github/workflows/verify.yml

  release:
    needs: verification
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # 读 Dependabot 告警需要它。缺了会 403，而 preflight 把 403 判为**拒绝发布**
      # 而不是"没有告警"——两者在日志里长得一模一样，混淆的代价就是发一个带 CVE 的产物。
      security-events: read
    steps:
      - uses: actions/checkout@v6
        with:
          # 闸二要比对"这个 tag 落后默认分支多少"，浅克隆没有历史可比。
          fetch-depth: 0

      # 发版前置检查：产物不该带着已知漏洞出门，也不该落后于默认分支。
      #
      # 为什么是 release 而不是 CI：Dependabot 告警是**仓库级**状态，不属于任何一次提交。
      # 放进 CI 会让默认分支因为一条与本次改动无关的告警长期变红——姊妹项目 amlagent
      # 就是这个下场（缺 NVD API key，依赖扫描永远跑不完），而"常年红的门禁"等于没有门禁。
      # 放在发版这一步，代价被限制成"这次先别发"，而发布本来也不该是全自动的。
      #
      # 这是实测的教训：mcp-sentinel v0.5.2 的 Release jar 里内嵌 jackson-databind 2.19.0，
      # 命中 5 条告警（2 HIGH + 3 MEDIUM），而当时 CI 全绿——它压根不查依赖。
      # 修复 b180618（2.21.5）在 master 上，却比 v0.5.2 晚 6 个提交，没能进那个产物。
      # 所以这里有两道闸：查仓库告警（闸一）**和**查这个 tag 落后了什么（闸二）。
      # 只留闸一是没用的——查的时候 master 已经修好了，干净的是 master，不是那个产物。
      - name: Preflight (dependency alerts + tag vs default branch)
        env:
          # Token must have Dependabot alerts read access (GitHub App or fine-grained PAT).
          # Missing permission blocks stable publication.
          GH_TOKEN: ${{ secrets.PREFLIGHT_TOKEN }}
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          base="origin/${{ github.event.repository.default_branch }}"
          out="$RUNNER_TEMP"

          git fetch --no-tags origin "${{ github.event.repository.default_branch }}"

          python3 scripts/fetch_dependabot_alerts.py --repository "$repo" \
            --output "$out/alerts.json" --receipt "$out/alerts-complete.json"
          echo 200 > "$out/alerts.http"

          args=(--alerts-http "$out/alerts.http" --alerts-json "$out/alerts.json"
                --alerts-receipt "$out/alerts-complete.json"
                --tag "${{ github.ref_name }}" --base "$base")

          python3 scripts/release_preflight.py "${args[@]}"

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Download the exact verified Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: sentinel-ubuntu-latest
          path: target

      - name: Bind tested artifact to tag and commit
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          python scripts/package_release.py --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT"

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/mcp-sentinel.jar
            target/SHA256SUMS.txt
            target/DEPENDENCIES.txt
            target/bom.json
            target/build-evidence.json
          generate_release_notes: true
