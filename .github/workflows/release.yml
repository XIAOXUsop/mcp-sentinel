name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Honor the recorded publication decision
        run: |
          PYTHONPATH=scripts python - <<'PY'
          from candidate_common import require_stable_allowed
          require_stable_allowed()
          PY
  verification:
    needs: policy
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/candidate.yml
  release:
    needs: verification
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements-validation.txt
      - name: Download complete acceptance and the exact tested JAR
        uses: actions/download-artifact@v5
        with:
          name: candidate-delivery
          path: evidence
      - name: Fresh real dependency inventory and complete preflight
        env:
          GH_TOKEN: ${{ secrets.PREFLIGHT_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          python scripts/fetch_dependabot_alerts.py --repository "$GITHUB_REPOSITORY" \
            --output "$RUNNER_TEMP/alerts.json" --receipt "$RUNNER_TEMP/alerts-complete.json"
          echo 200 > "$RUNNER_TEMP/alerts.http"
          python scripts/release_preflight.py \
            --alerts-http "$RUNNER_TEMP/alerts.http" --alerts-json "$RUNNER_TEMP/alerts.json" \
            --alerts-receipt "$RUNNER_TEMP/alerts-complete.json" --repository "$GITHUB_REPOSITORY" \
            --candidate-evidence evidence --tag "$RELEASE_TAG" --base "origin/$DEFAULT_BRANCH"
      - name: Package the verified bytes without rebuilding
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          python scripts/package_release.py --directory evidence/linux
          --candidate-evidence evidence --tag "$RELEASE_TAG" --commit "$GITHUB_SHA"
      - name: Publish only after all independent gates
        uses: softprops/action-gh-release@v2
        with:
          files: |
            evidence/linux/mcp-sentinel.jar
            evidence/linux/SHA256SUMS.txt
            evidence/linux/DEPENDENCIES.txt
            evidence/linux/bom.json
            evidence/linux/build-evidence.json
            evidence/candidate.json
          generate_release_notes: true
