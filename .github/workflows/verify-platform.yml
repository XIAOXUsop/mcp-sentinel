name: Verify one platform
on:
  workflow_call:
    inputs:
      os:
        type: string
        required: true
      engineering:
        type: boolean
        default: false
      canonical-artifact:
        type: string
        default: ''
permissions:
  contents: read
jobs:
  verify:
    runs-on: ${{ inputs.os }}
    timeout-minutes: 40
    env:
      PYTHONIOENCODING: utf-8
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        if: inputs.engineering
        with:
          node-version: '24.14.1'
          cache: npm
          cache-dependency-path: validation/interop/package-lock.json
      - name: Install core validators
        if: ${{ !inputs.engineering }}
        run: python -m pip install -r scripts/requirements-validation.txt
      - name: Install locked engineering validators
        if: inputs.engineering
        run: python -m pip install --require-hashes -r validation/interop/requirements-lock.txt
      - name: Install fixed external implementations
        if: inputs.engineering
        working-directory: validation/interop
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build and test Linux source
        id: build_linux
        if: runner.os != 'Windows'
        run: ./mvnw -B clean verify -Prelease-evidence
      - name: Build and test Windows source and fixtures
        id: build_windows
        if: runner.os == 'Windows'
        run: ./mvnw.cmd -B clean verify -Prelease-evidence
      - name: Download the canonical Linux candidate
        if: inputs.canonical-artifact != ''
        uses: actions/download-artifact@v5
        with:
          name: ${{ inputs.canonical-artifact }}
          path: target/canonical
      - name: Verify canonical evidence and adopt exact JAR and SBOM
        if: inputs.canonical-artifact != ''
        run: python scripts/check_candidate_evidence.py adopt --root target/canonical
      - name: Verify actual distributable
        id: artifact
        run: python scripts/verify_artifact.py
      - name: Generated evaluation with independent witnesses
        id: evaluation
        run: python scripts/evaluate.py
      - name: Python gate regressions
        id: python
        run: python scripts/run_python_tests.py
      - name: SARIF validator self-test
        id: schema
        run: python scripts/check_sarif_schema.py --selftest
      - name: Scan tracked source for secrets
        id: secret
        run: python scripts/check_secrets.py
      - name: Public implementation interoperability
        id: interop
        if: inputs.engineering
        run: python scripts/verify_interop.py
      - name: Independent approval processes
        id: approval
        if: inputs.engineering
        run: python scripts/verify_approval_processes.py
      - name: Five-step actual JAR demo
        id: demo
        if: inputs.engineering
        run: python scripts/run_candidate_demo.py
      - name: Prepare unlabeled development declarations
        id: corpus
        if: inputs.engineering
        run: python scripts/prepare_manual_corpus.py
      - name: Complete scan measurements
        id: performance
        if: inputs.engineering
        run: python scripts/measure_scan.py --interop target/interop
      - name: Bind complete platform evidence
        if: ${{ always() && inputs.engineering }}
        env:
          PLATFORM: ${{ runner.os == 'Windows' && 'win32' || 'linux' }}
          STAGE_OUTCOMES: >-
            {"build":"${{ runner.os == 'Windows' && steps.build_windows.outcome || steps.build_linux.outcome }}",
            "artifact":"${{ steps.artifact.outcome }}","evaluation":"${{ steps.evaluation.outcome }}",
            "python":"${{ steps.python.outcome }}","schema":"${{ steps.schema.outcome }}",
            "secret":"${{ steps.secret.outcome }}","interop":"${{ steps.interop.outcome }}",
            "approval":"${{ steps.approval.outcome }}","demo":"${{ steps.demo.outcome }}",
            "corpus":"${{ steps.corpus.outcome }}","performance":"${{ steps.performance.outcome }}"}
        run: python scripts/check_candidate_evidence.py platform --platform "$env:PLATFORM"
        shell: pwsh
      - name: Upload tested core artifact
        if: ${{ success() && !inputs.engineering }}
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-${{ inputs.os }}
          retention-days: 90
          if-no-files-found: error
          path: |
            target/mcp-sentinel.jar
            target/bom.json
            target/artifact-verification/build-evidence.json
      - name: Retain complete engineering evidence
        if: ${{ always() && inputs.engineering }}
        uses: actions/upload-artifact@v4
        with:
          name: validation-evidence-${{ inputs.os }}
          retention-days: 90
          if-no-files-found: error
          path: |
            target/mcp-sentinel.jar
            target/bom.json
            target/platform-receipt.json
            target/python-tests.json
            target/artifact-verification/**
            target/surefire-reports/**
            target/evaluation/**
            target/interop/**
            target/approval-processes/**
            target/candidate-demo/**
            target/manual-corpus/**
            target/performance/**
      - name: Retain core diagnostics
        if: ${{ always() && !inputs.engineering }}
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-diagnostics-${{ inputs.os }}
          retention-days: 90
          path: |
            target/surefire-reports/**
            target/artifact-verification/**
            target/python-tests.json
            target/evaluation/summary.json
